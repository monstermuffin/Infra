---
- name: Write ccagent environment file
  ansible.builtin.template:
    src: ccagent.env.j2
    dest: "{{ ccagent_home }}/.env"
    owner: "{{ ccagent_user }}"
    group: "{{ ccagent_user }}"
    mode: "0600"
  no_log: true
  when: ccagent_git_crypt_key | length > 0
  notify: Restart ccagent remote-control service
  tags: [secrets, configure]
