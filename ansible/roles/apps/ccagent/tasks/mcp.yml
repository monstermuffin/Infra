---
- name: Check registered MCP servers
  ansible.builtin.command:
    cmd: "{{ ccagent_bin }} mcp list"
  become: true
  become_user: "{{ ccagent_user }}"
  environment:
    HOME: "{{ ccagent_home }}"
  args:
    chdir: "{{ ccagent_workdir }}"
  register: _ccagent_mcp_list
  changed_when: false
  when: ccagent_ha_mcp_url | length > 0
  tags: [mcp, configure]

- name: Register Home Assistant MCP server (HTTP)
  ansible.builtin.command:
    cmd: >-
      {{ ccagent_bin }} mcp add --transport http home-assistant
      {{ ccagent_ha_mcp_url }}
      -s user
  become: true
  become_user: "{{ ccagent_user }}"
  environment:
    HOME: "{{ ccagent_home }}"
  args:
    chdir: "{{ ccagent_workdir }}"
  when:
    - ccagent_ha_mcp_url | length > 0
    - "'home-assistant:' not in _ccagent_mcp_list.stdout"
  no_log: true
  changed_when: true
  notify: Restart ccagent remote-control service
  tags: [mcp, configure]
