---
- name: Check registered MCP servers
  ansible.builtin.command:
    cmd: "{{ ccagent_bin }} mcp list"
  become: true
  become_user: "{{ ccagent_user }}"
  environment:
    HOME: "{{ ccagent_home }}"
  args:
    chdir: "{{ ccagent_workdir }}"
  register: _ccagent_mcp_list
  changed_when: false
  when: ccagent_mcphub_url | length > 0
  tags: [mcp, configure]

- name: Remove existing mcphub MCP server
  ansible.builtin.command:
    argv:
      - "{{ ccagent_bin }}"
      - mcp
      - remove
      - mcphub
  become: true
  become_user: "{{ ccagent_user }}"
  environment:
    HOME: "{{ ccagent_home }}"
  args:
    chdir: "{{ ccagent_workdir }}"
  when:
    - ccagent_mcp_force_register | default(false) | bool
    - "'mcphub:' in _ccagent_mcp_list.stdout"
  changed_when: true
  failed_when: false
  tags: [mcp, configure]

- name: Register mcphub MCP server
  ansible.builtin.command:
    argv:
      - "{{ ccagent_bin }}"
      - mcp
      - add
      - --transport
      - http
      - mcphub
      - "{{ ccagent_mcphub_url }}"
      - -H
      - "Authorization: Bearer {{ ccagent_mcphub_bearer_key }}"
      - -s
      - user
  become: true
  become_user: "{{ ccagent_user }}"
  environment:
    HOME: "{{ ccagent_home }}"
  args:
    chdir: "{{ ccagent_workdir }}"
  when: "'mcphub:' not in _ccagent_mcp_list.stdout"
  no_log: true
  changed_when: true
  notify: Restart ccagent remote-control service
  tags: [mcp, configure]
