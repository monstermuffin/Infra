#       - public_key: "aBcD..."
#         preshared_key: "{{ vault_wg_preshared_key }}"
#         endpoint: "aah.muffn.io:51826"
#         allowed_ips: "10.83.0.0/16, 10.82.0.0/16"
#         persistent_keepalive: 5
wireguard_interfaces: {}
