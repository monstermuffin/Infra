---
pve_lxcs_tubeless01:
  tubeless01:
    vmid: 151
    hostname: tubeless01.aah.muffn.io
    node: pve03
    cores: 4
    memory: 2048
    swap: 512
    disk: "16G"
    network_ip: "10.82.10.151/24"
    network_gw: "10.82.10.1"
    network_vlan: 710
    unprivileged: true
    tags:
      - ansible
      - os_linux
      - os_trixie
      - site_aah
      - podman_app
      - app_tubeless
    features: "{{ lxc_features_podman }}"
    bind_mounts:
      - host_path: /mnt/aah-fs01/media/youtube
        lxc_path: /mnt/youtube
        shared: true
    ha: "{{ lxc_ha_default }}"
    replication: "{{ lxc_replication_default }}"
