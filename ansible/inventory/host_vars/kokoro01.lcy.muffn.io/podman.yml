---
podman_enabled: true

podman_networks:
  kokoro: {}

podman_apps:
  kokoro-fastapi:
    enabled: true
    image: ghcr.io/remsky/kokoro-fastapi-cpu
    # renovate: datasource=docker depName=ghcr.io/remsky/kokoro-fastapi-cpu
    tag: latest
    network: kokoro
    port: 8880
    env:
      TZ: Europe/London
    # CPU model load (PyTorch + Kokoro 82M) takes 30-60s on first start
    startup_timeout: 120

  wyoming-openai:
    enabled: true
    image: ghcr.io/roryeckel/wyoming_openai
    # renovate: datasource=docker depName=ghcr.io/roryeckel/wyoming_openai
    tag: latest
    network: kokoro
    port: 10300
    after:
      - kokoro-fastapi.service
    requires:
      - kokoro-fastapi.service
    env:
      TTS_OPENAI_URL: "http://kokoro-fastapi:8880/v1"
      TTS_MODELS: "kokoro"
      # Enable incremental streaming via sentence-boundary chunking (pySBD)
      TTS_STREAMING_MODELS: "kokoro"
      WYOMING_LANGUAGES: "en"
      TZ: Europe/London
