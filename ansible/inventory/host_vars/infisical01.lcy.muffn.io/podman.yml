---
podman_enabled: true

podman_networks:
  infisical: {}

podman_apps:
  infisical-redis:
    enabled: true
    image: redis
    tag: "7-alpine"
    container_name: infisical-redis
    network: infisical
    volumes:
      - /opt/infisical/redis:/data

  infisical-db:
    enabled: true
    image: postgres
    tag: "16-alpine"
    container_name: infisical-db
    network: infisical
    volumes:
      - /opt/infisical/postgres:/var/lib/postgresql/data
    env:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: "{{ infisical_db_password | trim }}"
      POSTGRES_DB: infisical

  infisical-app:
    enabled: true
    image: infisical/infisical
    tag: "v0.162.19"
    container_name: infisical-app
    port: 8080
    network: infisical
    startup_timeout: 90
    after:
      - infisical-db.service
      - infisical-redis.service
    requires:
      - infisical-db.service
      - infisical-redis.service
    env:
      NODE_ENV: production
      PORT: "8080"
      HOST: "0.0.0.0"
      SITE_URL: "http://infisical01.lcy.muffn.io:8080"
      ENCRYPTION_KEY: "{{ infisical_encryption_key | trim }}"
      AUTH_SECRET: "{{ infisical_auth_secret | trim }}"
      DB_CONNECTION_URI: "postgresql://infisical:{{ infisical_db_password | trim }}@infisical-db:5432/infisical"
      REDIS_URL: "redis://infisical-redis:6379"
      TELEMETRY_ENABLED: "false"

