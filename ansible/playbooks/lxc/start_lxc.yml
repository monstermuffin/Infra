---
# Start an LXC container via its Proxmox node.
# Triggered automatically when disabled.yml is deleted or lxc_disabled is set to false.
#
# Manual run:
#   ansible-playbook playbooks/lxc/start_lxc.yml -e lxc_target=radarr01.aah.muffn.io

- name: Resolve Proxmox node for {{ lxc_target }}
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Load meta.yml for {{ lxc_target }}
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../inventory/host_vars/{{ lxc_target }}/meta.yml"
      register: _lxc_meta_raw

    - name: Register Proxmox node in temporary group
      ansible.builtin.add_host:
        name: "{{ (_lxc_meta_raw.content | b64decode | from_yaml).proxmox_node }}"
        groups: _lxc_start_node

- name: Start container on Proxmox node
  hosts: _lxc_start_node
  gather_facts: false

  tasks:
    - name: Find VMID for {{ lxc_target }} (stopped only)
      ansible.builtin.shell: |
        pct list | awk 'NR>1 && $2 == "stopped" && ($NF == "{{ lxc_target }}" || $NF == "{{ lxc_target.split(".")[0] }}") {print $1; exit}'
      register: _lxc_vmid
      changed_when: false

    - name: Start {{ lxc_target }} (VMID {{ _lxc_vmid.stdout | trim }})
      ansible.builtin.command: pct start {{ _lxc_vmid.stdout | trim }}
      when: _lxc_vmid.stdout | trim | length > 0
      changed_when: true

    - name: Container not stopped — nothing to do
      ansible.builtin.debug:
        msg: "{{ lxc_target }} is not stopped on {{ inventory_hostname }}"
      when: _lxc_vmid.stdout | trim | length == 0
