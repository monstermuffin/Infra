---
# Apply nftables firewall rules to hosts that explicitly opt in.
#
# To onboard a new host, set in its host_vars (or group_vars):
#   firewall_enabled: true
#   firewall_allowed_tcp_ports: [...]   # etc.
#
# Target all firewall-managed hosts:
#   ansible-playbook playbooks/linux/apply_firewall.yml
#
# Target a single host:
#   ansible-playbook playbooks/linux/apply_firewall.yml --limit app.nbg1.muffn.io

- name: Apply host firewall
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  become: true

  pre_tasks:
    - name: Skip host unless firewall_enabled is explicitly true
      ansible.builtin.meta: end_host
      when: not (firewall_enabled | bool)

  roles:
    - linux/firewall
